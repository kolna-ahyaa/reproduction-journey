<!DOCTYPE html>

<head>

<title>🧬 رحلة التكاثر - السودان 2026</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f2846">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;font-family:'Tahoma','Arial',sans-serif;}
html,body{height:100%;background:linear-gradient(135deg,#0a1a2e 0%,#0f2846 25%,#163a5f 50%,#1a4a6e 75%,#0f2846 100%);overflow:hidden;color:#fff;position:relative;}
html::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle at 15% 25%, rgba(100,200,255,.10) 0%, transparent 8%),radial-gradient(circle at 85% 40%, rgba(126,211,33,.08) 0%, transparent 6%),radial-gradient(circle at 40% 75%, rgba(100,200,255,.06) 0%, transparent 7%),radial-gradient(circle at 65% 15%, rgba(126,211,33,.05) 0%, transparent 5%),radial-gradient(circle at 25% 90%, rgba(100,200,255,.07) 0%, transparent 6%),radial-gradient(circle at 75% 85%, rgba(255,215,0,.05) 0%, transparent 4%),radial-gradient(circle at 90% 10%, rgba(100,200,255,.06) 0%, transparent 5%);background-size:500px 500px,600px 600px,450px 450px,550px 550px,650px 650px,400px 400px,700px 700px;animation:bioFloat 25s ease-in-out infinite;pointer-events:none;z-index:0;}
@keyframes bioFloat{0%,100%{transform:translate(0,0) rotate(0deg);}33%{transform:translate(15px,-10px) rotate(1deg);}66%{transform:translate(-15px,10px) rotate(-1deg);}}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:12px;overflow-y:auto;z-index:1;}
.screen.active{display:flex;animation:screenIn .35s ease-out;}
@keyframes screenIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.screen.slide-right.active{animation:slideRight .35s ease-out;}
@keyframes slideRight{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:translateX(0);}}
.screen.zoom-in.active{animation:zoomIn .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes zoomIn{from{opacity:0;transform:scale(.85);}to{opacity:1;transform:scale(1);}}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
@keyframes pop{0%{transform:scale(1);}50%{transform:scale(1.05);}100%{transform:scale(1);}}
@keyframes shake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-6px);}40%,80%{transform:translateX(6px);}}
@keyframes glow{0%,100%{box-shadow:0 4px 14px rgba(255,215,0,.5);}50%{box-shadow:0 4px 24px rgba(255,215,0,.9);}}
@keyframes trophyPop{0%{transform:scale(0) rotate(-180deg);}60%{transform:scale(1.3) rotate(10deg);}100%{transform:scale(1) rotate(0);}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);}}
@keyframes dashFlow{to{stroke-dashoffset:-600;}}
@keyframes pulseAnim{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
#splash{justify-content:center;align-items:center;text-align:center;background:linear-gradient(160deg,rgba(10,26,46,.92),rgba(15,40,70,.85));}
#splash .logo{font-size:80px;margin-bottom:5px;animation:float 3s ease-in-out infinite;}
#splash h1{font-size:28px;color:#ffd700;margin:5px 0;text-shadow:0 3px 12px rgba(255,215,0,.5);cursor:pointer;font-weight:900;}
#splash h2{font-size:13px;color:#7ed321;margin:3px 0;font-weight:normal;}
#splash .subtitle{font-size:12px;color:#bbb;margin-top:8px;line-height:1.7;}
.user-bar{margin-top:10px;background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.05));padding:10px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.15);max-width:320px;width:100%;}
.user-bar .user-name{font-size:14px;font-weight:bold;color:#ffd700;}
.user-bar .user-level{font-size:12px;color:#7ed321;margin-top:2px;}
.user-bar .user-badges{font-size:16px;margin-top:4px;letter-spacing:2px;}
.user-bar .user-streak{font-size:11px;color:#ff9800;margin-top:4px;}
.menu-btns{margin-top:16px;display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px;}
.btn{padding:13px 22px;font-size:14px;font-weight:bold;border:none;border-radius:14px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3);transition:transform .15s;color:#fff;font-family:inherit;position:relative;}
.btn:active{transform:scale(.95);}
.btn-green{background:linear-gradient(135deg,#4CAF50,#2e7d32);}
.btn-blue{background:linear-gradient(135deg,#1a5490,#0d3d6e);}
.btn-purple{background:linear-gradient(135deg,#9c27b0,#6a1b9a);}
.btn-gold{background:linear-gradient(135deg,#FFA500,#e65100);}
.btn-red{background:linear-gradient(135deg,#d32f2f,#b71c1c);}
.btn-teal{background:linear-gradient(135deg,#00897b,#00695c);}
.btn-pink{background:linear-gradient(135deg,#e91e63,#ad1457);}
.btn-cyan{background:linear-gradient(135deg,#00bcd4,#0097a7);}
.btn-small{padding:9px 16px;font-size:12px;}
.btn-daily{background:linear-gradient(135deg,#ffd700,#ff6f00);box-shadow:0 4px 14px rgba(255,215,0,.5);animation:glow 2s ease-in-out infinite;}
.ctrl-btns{position:fixed;top:10px;right:10px;display:flex;gap:6px;z-index:200;}
.ctrl-btn{background:rgba(255,255,255,.2);backdrop-filter:blur(10px);color:#fff;border:1px solid rgba(255,255,255,.3);width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.ctrl-btn.active{background:linear-gradient(135deg,#ffd700,#ff9800);color:#333;}.top-bar{background:linear-gradient(135deg,#0f2846,#0a1a2e);color:#fff;padding:10px 100px 10px 14px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:10px;box-shadow:0 4px 12px rgba(0,0,0,.3);flex-wrap:wrap;gap:4px;border:1px solid rgba(100,200,255,.15);}
.top-bar b{color:#ffd700;font-size:13px;}
.back-btn{background:rgba(255,255,255,.15);padding:6px 14px;border-radius:10px;cursor:pointer;font-size:12px;border:1px solid rgba(255,255,255,.2);color:#fff;font-family:inherit;}
#mapScreen{background:linear-gradient(160deg,rgba(74,144,217,0.15),rgba(44,83,100,0.25));}
.map-wrapper{position:relative;width:100%;flex:1;background:linear-gradient(160deg,#87CEEB,#4A90D9);border-radius:20px;overflow:hidden;box-shadow:inset 0 0 40px rgba(0,0,0,.2);touch-action:none;cursor:grab;min-height:400px;}
.map-wrapper.grabbing{cursor:grabbing;}
.sudan-svg{position:absolute;top:0;left:0;width:100%;height:100%;transform-origin:0 0;will-change:transform;transition:transform .5s cubic-bezier(.34,1.4,.64,1);}
.map-wrapper.zooming .sudan-svg{transition:transform .8s cubic-bezier(.34,1.4,.64,1);}
.map-controls{position:absolute;bottom:14px;left:14px;display:flex;flex-direction:column;gap:8px;z-index:50;}
.map-ctrl-btn{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.9);color:#1a5490;border:2px solid rgba(26,84,144,.3);font-size:20px;font-weight:bold;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-family:inherit;}
.map-ctrl-btn:active{transform:scale(.9);background:#ffd700;}
.map-hint{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:6px 14px;border-radius:20px;z-index:50;animation:float 3s ease-in-out infinite;pointer-events:none;}
.state-circle{cursor:pointer;}
.state-circle.free{fill:url(#gFree);}
.state-circle.in-progress{fill:url(#gProgress);}
.state-circle.completed{fill:url(#gComplete);}
.state-circle.needs-code{fill:url(#gLocked);}
.connection-path{stroke:#fff;stroke-width:3;stroke-dasharray:12,12;fill:none;opacity:.55;animation:dashFlow 25s linear infinite;}
.pulse{animation:pulseAnim 2s ease-in-out infinite;transform-origin:center;transform-box:fill-box;}
#stagesScreen{background:linear-gradient(160deg,rgba(10,26,46,.85),rgba(15,40,70,.85));}
.stage-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 6px 20px;}
.stage-btn{position:relative;background:linear-gradient(145deg,#ffffff,#e8f0f7);border:none;border-radius:18px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-family:inherit;color:#1a5490;box-shadow:0 5px 0 rgba(0,0,0,.15),0 7px 12px rgba(0,0,0,.2);border:2px solid rgba(255,255,255,.6);}
.stage-btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.15),0 3px 5px rgba(0,0,0,.2);}
.stage-btn.done{background:linear-gradient(145deg,#c8e6c9,#81c784);color:#1b5e20;box-shadow:0 5px 0 rgba(46,125,50,.4),0 7px 12px rgba(0,0,0,.2);}
.stage-btn.current{background:linear-gradient(145deg,#ffe082,#ffb300);color:#4a2c00;box-shadow:0 5px 0 rgba(230,81,0,.5),0 7px 16px rgba(255,152,0,.4);border-color:#ffd700;}
.stage-btn.locked{background:linear-gradient(145deg,#b0bec5,#78909c);color:#fff;opacity:.7;cursor:not-allowed;}
.stage-btn .stage-num-big{font-size:20px;font-weight:900;line-height:1;}
.stage-btn .stage-type-icon{font-size:14px;line-height:1;}
.stage-btn .stage-local{font-size:9px;opacity:.75;margin-top:2px;}
.stage-btn .badge-done{position:absolute;top:-8px;right:-8px;font-size:20px;}
.stage-btn .badge-lock{position:absolute;top:-6px;right:-6px;font-size:16px;} 
#gameScreen{background:linear-gradient(160deg,rgba(26,84,144,0.85),rgba(13,61,110,0.9));}
.game-header{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.1);padding:10px 14px;border-radius:14px;margin-bottom:12px;font-size:11px;border:1px solid rgba(255,255,255,.15);flex-wrap:wrap;gap:4px;}
.game-header b{color:#ffd700;font-size:13px;}
.question-card{background:linear-gradient(135deg,#ffffff,#e8f0f7);color:#1a5490;padding:20px;border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.35);margin-bottom:14px;position:relative;}
.question-card.why{background:linear-gradient(135deg,#fff3e0,#ffe0b2);color:#bf360c;border:2px solid #ff9800;}
.question-card.why::before{content:'علل';position:absolute;top:8px;left:12px;background:#e65100;color:#fff;font-size:11px;padding:3px 10px;border-radius:10px;font-weight:bold;}
.question-card.tf{background:linear-gradient(135deg,#e8f5e9,#c8e6c9);color:#1b5e20;border:2px solid #4CAF50;}
.question-card.tf::before{content:'صح أم خطأ';position:absolute;top:8px;left:12px;background:#2e7d32;color:#fff;font-size:11px;padding:3px 10px;border-radius:10px;font-weight:bold;}
.question-card.order{background:linear-gradient(135deg,#e1f5fe,#b3e5fc);color:#01579b;border:2px solid #0288d1;}
.question-card.order::before{content:'رتب';position:absolute;top:8px;left:12px;background:#0277bd;color:#fff;font-size:11px;padding:3px 10px;border-radius:10px;font-weight:bold;}
.question-icon{font-size:56px;text-align:center;display:block;margin-bottom:8px;}
.question-text{font-size:16px;font-weight:bold;line-height:1.65;text-align:center;}
.options{display:flex;flex-direction:column;gap:9px;}
.option-btn{background:#fff;padding:14px 16px;border-radius:14px;border:2px solid rgba(26,84,144,.2);text-align:right;font-size:14px;cursor:pointer;color:#1a5490;font-family:inherit;font-weight:bold;box-shadow:0 3px 8px rgba(0,0,0,.1);}
.option-btn.correct{background:linear-gradient(135deg,#4CAF50,#2e7d32);color:#fff;border-color:#4CAF50;animation:pop .3s;}
.option-btn.wrong{background:linear-gradient(135deg,#f44336,#c62828);color:#fff;border-color:#f44336;animation:shake .4s;}
.timer-bar{height:6px;background:rgba(255,255,255,.15);border-radius:3px;margin-bottom:10px;overflow:hidden;}
.timer-fill{height:100%;background:linear-gradient(90deg,#4CAF50,#8BC34A);transition:width 1s linear;border-radius:3px;}
.timer-fill.warning{background:linear-gradient(90deg,#ff9800,#ff5722);}
.timer-fill.danger{background:linear-gradient(90deg,#f44336,#b71c1c);}
.bottom-bar{display:flex;gap:8px;margin-top:10px;}
.bottom-bar .btn{flex:1;font-size:12px;padding:11px;}
.feedback{text-align:center;padding:11px;margin-top:11px;border-radius:14px;font-weight:bold;display:none;font-size:13px;}
.feedback.show{display:block;animation:pop .3s;}
.feedback.ok{background:linear-gradient(135deg,#a5d6a7,#4CAF50);color:#fff;}
.feedback.err{background:linear-gradient(135deg,#ef9a9a,#f44336);color:#fff;}
.feedback.info{background:linear-gradient(135deg,#fff9c4,#ffd54f);color:#856404;}
#mixScreen{background:linear-gradient(160deg,rgba(26,84,144,0.85),rgba(13,61,110,0.9));}
.mix-image-card{background:linear-gradient(135deg,#ffffff,#e8f0f7);padding:22px;border-radius:22px;text-align:center;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);}
.mix-icon{font-size:90px;line-height:1;animation:float 3s ease-in-out infinite;}
.mix-hint{color:#1a5490;font-size:12px;margin-top:10px;font-weight:bold;opacity:.8;}
.mix-answer{display:flex;justify-content:center;gap:6px;margin-bottom:14px;flex-wrap:wrap;min-height:56px;}
.mix-slot{width:40px;height:48px;background:rgba(255,255,255,.15);border:2px dashed rgba(255,255,255,.4);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;color:#ffd700;}
.mix-slot.filled{background:#fff;border:2px solid #ffd700;color:#1a5490;border-style:solid;animation:pop .25s;}
.mix-slot.correct{background:linear-gradient(135deg,#4CAF50,#2e7d32);border-color:#4CAF50;color:#fff;}
.mix-slot.wrong{background:linear-gradient(135deg,#f44336,#c62828);border-color:#f44336;color:#fff;animation:shake .4s;}
.mix-letters{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-width:400px;margin:0 auto;padding:0 8px;}
.letter-btn{aspect-ratio:1;background:linear-gradient(135deg,#ffd700,#ff9800);color:#fff;border:none;border-radius:14px;font-size:22px;font-weight:bold;cursor:pointer;box-shadow:0 4px 0 rgba(230,81,0,.5),0 5px 8px rgba(0,0,0,.2);font-family:inherit;}
.letter-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(230,81,0,.5);}
.letter-btn:disabled{opacity:.25;}
#tfScreen{background:linear-gradient(160deg,rgba(26,84,144,0.85),rgba(13,61,110,0.9));}
.tf-card{background:linear-gradient(135deg,#e8f5e9,#c8e6c9);color:#1b5e20;padding:22px;border-radius:22px;text-align:center;margin-bottom:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);border:3px solid #4CAF50;}
.tf-statement{font-size:17px;font-weight:bold;line-height:1.7;}
.tf-icon{font-size:56px;display:block;margin-bottom:10px;}
.tf-buttons{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px;}
.tf-btn{padding:24px 14px;border-radius:18px;font-size:18px;font-weight:900;cursor:pointer;border:none;font-family:inherit;transition:transform .15s;box-shadow:0 6px 0 rgba(0,0,0,.25);}
.tf-btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25);}
.tf-true{background:linear-gradient(135deg,#4CAF50,#2e7d32);color:#fff;}
.tf-false{background:linear-gradient(135deg,#f44336,#c62828);color:#fff;}
.tf-btn.correct{background:linear-gradient(135deg,#ffd700,#ff9800);color:#333;}
.tf-btn.wrong{opacity:.4;}
.tf-btn:disabled{cursor:not-allowed;}
#orderScreen{background:linear-gradient(160deg,rgba(26,84,144,0.85),rgba(13,61,110,0.9));}
.order-title{background:linear-gradient(135deg,#e1f5fe,#b3e5fc);color:#01579b;padding:14px;border-radius:14px;text-align:center;font-weight:bold;font-size:14px;margin-bottom:12px;border:2px solid #0288d1;}

.confetti{position:absolute;width:10px;height:14px;top:-20px;animation:fall linear infinite;border-radius:2px;z-index:0;}
.complete-trophy{font-size:80px;animation:trophyPop .8s cubic-bezier(.34,1.56,.64,1);position:relative;z-index:1;}
#completeScreen h1{font-size:22px;color:#ffd700;margin:12px 0 5px;position:relative;z-index:1;text-shadow:0 3px 10px rgba(0,0,0,.5);}
.wilaya-name{font-size:28px;font-weight:900;margin:10px 0;padding:16px;border-radius:16px;background:linear-gradient(135deg,rgba(255,255,255,.25),rgba(255,255,255,.1));width:100%;max-width:400px;color:#b0d878;border:3px solid rgba(176,216,120,.5);position:relative;z-index:1;}
.stars-earned{font-size:32px;margin:6px 0;letter-spacing:5px;position:relative;z-index:1;}
.complete-stats{font-size:13px;line-height:2;position:relative;z-index:1;margin-top:6px;color:#fff;background:rgba(0,0,0,.2);padding:12px;border-radius:14px;max-width:400px;}
.new-badge{margin-top:8px;padding:10px 16px;background:linear-gradient(135deg,#ffd700,#ff6f00);color:#333;font-weight:bold;border-radius:14px;font-size:13px;animation:pop .5s;position:relative;z-index:1;}
#leaderboardScreen{background:linear-gradient(160deg,rgba(30,60,114,0.9),rgba(42,82,152,0.9));padding:18px;}

.lb-row{background:rgba(255,255,255,.1);padding:12px;border-radius:14px;margin-bottom:7px;display:flex;align-items:center;gap:10px;font-size:13px;animation:slideRight .4s;}

#quickScreen{background:linear-gradient(160deg,rgba(74,20,140,0.9),rgba(123,31,162,0.9));justify-content:center;align-items:center;text-align:center;padding:20px;}
