<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة كلنا أحياء - مركز الامتحانات</title>
    <!-- سنربط ملف الـ CSS هنا في الخطوة القادمة -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الحاوية الرئيسية للعبة/الامتحان -->
    <div class="quiz-container">
        
        <!-- شاشة اللعب والأسئلة -->
        <div id="quiz-screen">
            <!-- الهيدر: يحتوي على السنة التنافسية والمجموع -->
            <div class="quiz-header">
                <span id="exam-year">جاري التحميل...</span>
                <span id="question-counter">السؤال: 0 / 0</span>
            </div>

            <!-- شريط التقدم العلوي -->
            <div class="progress-bar-container">
                <div id="progress-fill"></div>
            </div>

            <!-- صندوق السؤال -->
            <div class="question-box">
                <span id="question-topic" class="topic-badge">باب التكاثر</span>
                <h2 id="question-text">جاري تحميل السؤال...</h2>
            </div>

            <!-- حاوية خيارات الإجابة -->
            <div id="options-container" class="options-grid">
                <!-- الخيارات ستتولد هنا ديناميكياً بواسطة الـ JavaScript -->
            </div>

            <!-- منطقة التحكم والأزرار -->
            <div class="quiz-footer">
                <button id="next-btn" class="btn disabled" disabled>السؤال التالي</button>
            </div>
        </div>

        <!-- شاشة النتيجة النهائية (تكون مخفية في البداية) -->
        <div id="result-screen" class="hidden">
            <div class="result-card">
                <div class="result-icon">🏆</div>
                <h2>انتهى الاختبار!</h2>
                <p class="result-text">لقد أكملت أول 20 سؤالاً من امتحانات الشهادة الثانوية.</p>
                
                <!-- صندوق الدرجة -->
                <div class="score-box">
                    <span class="score-label">درجتك هي:</span>
                    <span id="final-score">0 / 20</span>
                </div>

                <!-- زر إعادة المحاولة -->
                <button id="restart-btn" class="btn btn-primary">إعادة الاختبار 🔄</button>
            </div>
        </div>

    </div>

    <!-- ربط ملفات الـ JavaScript (ملف البيانات وملف التحكم) -->
    <script src="exams.js"></script>
    <script src="app.js"></script>
</body>
</html>
